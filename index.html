<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Logical Works — Strategy, Design, and Technology for Ambitious Brands</title>
  <meta name="description" content="Logical Works is a strategy, design, and technology studio. We build brands, products, and platforms for companies that are serious about growth." />
  <meta name="theme-color" content="#171b17" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <script>
    // Prevent theme FOUC — apply stored/system theme before paint
    (function() {
      var t = localStorage.getItem('lw-theme');
      if (!t) {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', t === 'dark' ? '#171b17' : '#ede7d9');
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" crossorigin src="/src/main.ts"></script>
</body>
</html>
